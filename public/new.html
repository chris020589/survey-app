<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新增/編輯問卷 - 學術問卷系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="academic-survey.css">
  <!-- 引入 Sortable.js 庫 -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>
    .question-container {
      background-color: white;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      position: relative;
    }
    
    .drag-handle {
      cursor: grab;
      font-size: 1.5em;
      user-select: none;
      margin-right: 15px;
      color: var(--primary-color);
    }
    
    .options-container {
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--border-color);
    }
    
    .option-item {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }
    
    .option-item input {
      flex-grow: 1;
      margin-right: 10px;
      margin-bottom: 0;
    }
    
    .option-item button {
      background-color: var(--error-color);
      padding: 5px 10px;
    }
    
    .question-actions {
      margin-top: 15px;
      display: flex;
      gap: 10px;
    }
    
    .validation-options {
      background-color: #f9f9f9;
      padding: 15px;
      border-radius: 5px;
      margin: 15px 0;
    }
    
    .validation-options label {
      display: inline-block;
      margin-right: 15px;
    }
    
    .validation-options input {
      width: 100px;
      display: inline-block;
    }
    
    .image-upload-container {
      margin: 15px 0;
    }
    
    .image-preview {
      margin-top: 10px;
      position: relative;
    }
    
    .image-preview img {
      max-width: 200px;
      max-height: 200px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
    }
    
    .image-preview button {
      position: absolute;
      top: 5px;
      right: 5px;
      background-color: var(--error-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .live-preview {
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 30px;
      border: 2px dashed var(--secondary-color);
    }
    
    .live-preview h2 {
      color: var(--primary-color);
      margin-top: 0;
    }
    
    .pagination-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }
    
    .page-button {
      padding: 8px 15px;
      background-color: white;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      cursor: pointer;
    }
    
    .page-button.active {
      background-color: var(--secondary-color);
      color: white;
      border-color: var(--secondary-color);
    }
    
    .main-actions {
      display: flex;
      gap: 15px;
      margin: 20px 0;
    }
    
    .main-actions button {
      flex: 1;
      padding: 12px;
      font-size: 16px;
    }
    
    textarea {
      min-height: 100px;
      resize: vertical;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <div class="logo">學術問卷系統</div>
      <nav>
        <ul>
          <li><a href="dashboard.html">問卷總覽</a></li>
          <li><a href="new.html" class="active">新增問卷</a></li>
          <li><a href="#" onclick="logout()">登出</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="container">
    <h1>新增/編輯問卷</h1>
    
    <!-- 分頁切換按鈕 -->
    <div id="paginationControls" class="pagination-controls">
      <button type="button" class="btn" onclick="addPage()">新增分頁</button>
      <button type="button" class="btn btn-primary" onclick="exportSurvey()">匯出問卷</button>
      <input type="file" id="importFile" style="display:none" accept=".json" onchange="importSurvey(event)">
      <button type="button" class="btn" onclick="document.getElementById('importFile').click()">匯入問卷</button>
      <div id="pageButtons"></div>
    </div>
    
    <!-- 即時顯示區域 -->
    <div class="live-preview">
      <h2 id="liveTitle">問卷標題即時顯示</h2>
      <p id="liveDescription">問卷描述即時顯示</p>
    </div>
    
    <form id="surveyForm" class="card">
      <div class="form-group">
        <label for="title">問卷標題</label>
        <input type="text" id="title" placeholder="請輸入問卷標題" required oninput="updateLiveTitle(this.value)">
      </div>
      
      <div class="form-group">
        <label for="description">問卷描述</label>
        <textarea id="description" placeholder="請輸入問卷描述" oninput="updateLiveDescription(this.value)"></textarea>
      </div>
      
      <div id="questionsContainer"></div>
      
      <div class="main-actions">
        <button type="button" class="btn" onclick="addQuestion()">新增題目</button>
        <button type="button" class="btn btn-primary" onclick="previewSurvey()">預覽問卷</button>
        <button type="button" id="saveButton" class="btn btn-success" onclick="saveSurvey()">儲存問卷</button>
      </div>
    </form>
  </div>

  <footer>
    <p>&copy; 2023 學術問卷系統 - 為碩博士生研究提供支持</p>
  </footer>

  <script>
    // 處理 API 響應，檢查 token 是否失效
    function handleApiResponse(response) {
      if (response.status === 401 || response.status === 403) {
        alert('登入已過時，請重新登入!');
        localStorage.removeItem('token'); // 清除失效的 token
        window.location.href = 'index.html'; // 重定向到登入頁面
        return null;
      }
      return response;
    }
    
    // 登出功能
    function logout() {
      localStorage.removeItem('token');
      window.location.href = 'index.html';
    }
    
    const API_URL = 'http://localhost:5000/api/surveys';
    let questions = [];
    let currentPage = 1; // 當前分頁
    let totalPages = 1; // 總分頁數
    let isEditMode = false;
    let editingSurveyId = null;
    
    // 新增分頁
    function addPage() {
      totalPages++;
      currentPage = totalPages;
      renderPaginationControls();
      renderQuestions();
    }

    // 切換分頁
    function switchPage(page) {
      currentPage = page;
      renderQuestions();
    }

    // 渲染分頁控制按鈕
    function renderPaginationControls() {
      const pageButtons = document.getElementById('pageButtons');
      pageButtons.innerHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        pageButtons.innerHTML += `
          <button type="button" onclick="switchPage(${i})" ${i === currentPage ? 'disabled' : ''}>
            分頁 ${i}
          </button>
        `;
      }
    }

    // 新增題目
    function addQuestion() {
      const questionId = `q${questions.length}`;
      questions.push({
      id: questionId,
      page: currentPage, // 將題目分配到當前分頁
      type: 'single', // 預設為單選題
      text: '',
      options: [],
      required: false,
      validation: {
        minValue: '',
        maxValue: '',
        minLength: '',
        maxLength: '',
        pattern: '',
        maxChoices: '' // 多選題最多選擇數量
        },
        image: null // 新增圖片屬性
    });

    renderQuestions();
  }

    // 渲染題目
    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      // 過濾當前分頁的題目
      const currentQuestions = questions.filter(q => q.page === currentPage);

      currentQuestions.forEach((q, index) => {
        const questionHtml = `
          <div class="question-container" id="${q.id}">
            <span class="drag-handle" style="cursor: grab;">☰</span>
            <div style="flex-grow: 1;">
              <input type="text" placeholder="題目描述" value="${q.text}" onchange="updateQuestionText('${q.id}', this.value)">
              <div>
                <select onchange="updateQuestionType('${q.id}', this.value)">
                  <option value="single" ${q.type === 'single' ? 'selected' : ''}>單選題</option>
                  <option value="multiple" ${q.type === 'multiple' ? 'selected' : ''}>多選題</option>
                  <option value="dropdown" ${q.type === 'dropdown' ? 'selected' : ''}>下拉選單</option>
                  <option value="text" ${q.type === 'text' ? 'selected' : ''}>簡答題</option>
                  <option value="textarea" ${q.type === 'textarea' ? 'selected' : ''}>詳答題</option>
                  <option value="date" ${q.type === 'date' ? 'selected' : ''}>日期</option>
                  <option value="time" ${q.type === 'time' ? 'selected' : ''}>時間</option>
                  <option value="number" ${q.type === 'number' ? 'selected' : ''}>數字</option>
                  <option value="email" ${q.type === 'email' ? 'selected' : ''}>電子郵件</option>
                  <option value="file" ${q.type === 'file' ? 'selected' : ''}>檔案上傳</option>
                </select>
                <label>
                  必填
                  <input type="checkbox" ${q.required ? 'checked' : ''} onchange="toggleRequired('${q.id}', this.checked)">
                </label>
              </div>
          
              <!-- 圖片上傳區域 -->
              <div class="image-upload-container">
                <input type="file" id="image-${q.id}" style="display:none" accept="image/*" onchange="uploadQuestionImage('${q.id}', event)">
                <button type="button" onclick="document.getElementById('image-${q.id}').click()">
                  ${q.image ? '更換圖片' : '上傳圖片'}
                </button>
                ${q.image ? `
                  <div>
                    <img src="${q.image}" alt="題目圖片" style="max-width: 200px; max-height: 200px; margin-top: 10px;">
                    <button type="button" onclick="removeQuestionImage('${q.id}')">刪除圖片</button>
                  </div>
            `     : ''}
              </div>
          
              ${renderValidationOptions(q)}
          
              <div class="options-container">
                ${renderOptions(q)}
              </div>
              <button type="button" onclick="removeQuestion('${q.id}')">刪除題目</button>
            </div>
          </div>
    `    ;
        container.innerHTML += questionHtml;
      });
      initSortable();
    }

    // 上傳題目圖片
    async function uploadQuestionImage(questionId, event) {
      const file = event.target.files[0];
      if (!file) return;

      // 檢查檔案類型
      if (!file.type.startsWith('image/')) {
        alert('請上傳圖片檔案');
        return;
      }

      // 檢查檔案大小 (限制為 5MB)
      if (file.size > 5 * 1024 * 1024) {
        alert('圖片大小不能超過 5MB');
        return;
      }

      try {
        // 顯示上傳中提示
        const loadingMsg = `正在上傳圖片...`;
        const loadingEl = document.createElement('div');
        loadingEl.textContent = loadingMsg;
        loadingEl.id = `loading-${questionId}`;
        document.getElementById(questionId).appendChild(loadingEl);

        // 建立 FormData 物件
        const formData = new FormData();
        formData.append('image', file);
        
        // 上傳圖片到伺服器
        const token = localStorage.getItem('token');
        let res = await fetch('http://localhost:5000/api/upload', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`
          },
          body: formData
        });
        
        // 處理 token 失效的情況
        res = handleApiResponse(res);
        if (!res) return; // 如果 token 失效，handleApiResponse 會返回 null
        
        // 移除上傳中提示
        const loadingElement = document.getElementById(`loading-${questionId}`);
        if (loadingElement) loadingElement.remove();
        
        if (res.ok) {
          const data = await res.json();
          console.log('上傳成功:', data);
          
          // 測試圖片 URL
          try {
            await testImageUrl(data.imageUrl);
            console.log('圖片 URL 有效');
          } catch (e) {
            console.error('圖片 URL 無效');
            alert('圖片上傳成功，但無法顯示。請檢查伺服器設置。');
          }
          
          // 更新題目的圖片屬性
          const question = questions.find(q => q.id === questionId);
          question.image = data.imageUrl;
          renderQuestions();
        } else {
          let errorMsg = '上傳失敗';
          try {
            const errorData = await res.json();
            errorMsg = errorData.error || '未知錯誤';
          } catch (e) {
            errorMsg = await res.text() || '未知錯誤';
          }
          alert(`上傳圖片失敗：${errorMsg}`);
        }
      } catch (err) {
        console.error('上傳圖片時發生錯誤:', err);
        alert(`上傳圖片失敗：${err.message || '網絡錯誤，請檢查伺服器連接'}`);
      }
    }

    // 刪除題目圖片
    function removeQuestionImage(questionId) {
      const question = questions.find(q => q.id === questionId);
      question.image = null;
      renderQuestions();
    }

    // 測試圖片 URL
    function testImageUrl(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.onload = () => resolve(true);
        img.onerror = () => reject(false);
        img.src = url;
      });
    }

    // 初始化 Sortable
    function initSortable() {
      const container = document.getElementById('questionsContainer');
      if (!container) return;
      if (window.sortableInstance) window.sortableInstance.destroy();
      window.sortableInstance = Sortable.create(container, {
        handle: '.drag-handle',
        animation: 150,
        onEnd: function (evt) {
          // 只針對當前分頁的題目排序
          const currentQuestions = questions.filter(q => q.page === currentPage);
          const movedItem = currentQuestions.splice(evt.oldIndex, 1)[0];
          currentQuestions.splice(evt.newIndex, 0, movedItem);
          // 更新 questions 陣列順序
          let idx = 0;
          questions = questions.map(q => {
            if (q.page === currentPage) {
              return currentQuestions[idx++];
            }
            return q;
          });
          renderQuestions();
        }
      });
    }

    // 即時更新標題
    function updateLiveTitle(value) {
      document.getElementById('liveTitle').innerText = value || '問卷標題即時顯示';
    }

    // 即時更新描述
    function updateLiveDescription(value) {
      document.getElementById('liveDescription').innerText = value || '問卷描述即時顯示';
    }

    // 渲染選項
    function renderOptions(question) {
      if (question.type === 'single' || question.type === 'multiple' || question.type === 'dropdown') {
        return `
          ${question.options.map((opt, index) => `
            <div>
              <input type="text" value="${opt}" onchange="updateOption('${question.id}', ${index}, this.value)">
              <button type="button" onclick="removeOption('${question.id}', ${index})">刪除選項</button>
            </div>
          `).join('')}
          <button type="button" onclick="addOption('${question.id}')">新增選項</button>
        `;
      } else if (question.type === 'date') {
        return `<input type="date" disabled>`;
      } else if (question.type === 'time') {
        return `<input type="time" disabled>`;
      } else {
        return ''; // 簡答題和詳答題不需要選項
      }
    }

    // 渲染驗證選項
    function renderValidationOptions(question) {
      if (question.type === 'number') {
        return `
          <div class="validation-options">
            <label>最小值:
              <input type="number" value="${question.validation?.minValue || ''}" 
                onchange="updateValidation('${question.id}', 'minValue', this.value)">
            </label>
            <label>最大值:
              <input type="number" value="${question.validation?.maxValue || ''}" 
                onchange="updateValidation('${question.id}', 'maxValue', this.value)">
            </label>
          </div>
          <div class="validation-display">
            ${question.validation?.minValue && question.validation?.maxValue ? 
              `<p class="validation-info">數字範圍限制: ${question.validation.minValue} - ${question.validation.maxValue}</p>` : 
              question.validation?.minValue ? 
              `<p class="validation-info">最小值: ${question.validation.minValue}</p>` : 
              question.validation?.maxValue ? 
              `<p class="validation-info">最大值: ${question.validation.maxValue}</p>` : ''}
          </div>
        `;
      } else if (question.type === 'text' || question.type === 'textarea') {
        return `
          <div class="validation-options">
            <label>最少字數:
              <input type="number" value="${question.validation?.minLength || ''}" 
                onchange="updateValidation('${question.id}', 'minLength', this.value)">
            </label>
            <label>最多字數:
              <input type="number" value="${question.validation?.maxLength || ''}" 
                onchange="updateValidation('${question.id}', 'maxLength', this.value)">
            </label>
          </div>
          <div class="validation-display">
            ${question.validation?.maxLength ? 
              `<p class="validation-info">字數限制: ${question.validation?.minLength || '0'} - ${question.validation.maxLength} 字</p>` : ''}
          </div>
        `;
      } else if (question.type === 'multiple') {
        return `
          <div class="validation-options">
            <label>最多選擇項數:
              <input type="number" min="0" value="${question.validation?.maxChoices || ''}" 
                onchange="updateValidation('${question.id}', 'maxChoices', this.value)">
            </label>
          </div>
          <div class="validation-display">
            ${question.validation?.maxChoices ? 
              `<p class="validation-info">最多可選擇 ${question.validation.maxChoices} 項</p>` : ''}
          </div>
        `;
      } else if (question.type === 'email') {
        return `
          <div class="validation-options">
            <p>將驗證電子郵件格式</p>
          </div>
        `;
      }
      return '';
    }

    // 初始化
    document.addEventListener('DOMContentLoaded', async function() {
      renderPaginationControls();
      renderQuestions();
      // 檢查是否為編輯模式並載入問卷數據
      await checkEditMode();
    });

    // 預覽問卷
    function previewSurvey() {
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;

      // 檢查必填項
      const emptyRequiredQuestions = questions.filter(q => q.required && !q.text);
      if (emptyRequiredQuestions.length > 0) {
        alert('有必填題目尚未填寫題目描述！');
        return;
      }



      // 將問卷資料存入 localStorage
      localStorage.setItem('previewSurvey', JSON.stringify({ title, description, questions }));

      // 跳轉到 create.html
      window.location.href = 'create.html?preview=true';
    }

    // 更新驗證設置
    function updateValidation(questionId, validationType, value) {
      const question = questions.find(q => q.id === questionId);
      if (!question.validation) {
        question.validation = {};
      }
      question.validation[validationType] = value;
    }

    // 更新題目文字
    function updateQuestionText(questionId, text) {
      const question = questions.find(q => q.id === questionId);
      question.text = text;
    }

    // 更新題目類型
    function updateQuestionType(questionId, type) {
      const question = questions.find(q => q.id === questionId);
      const oldImage = question.image; // 保存原有圖片
      question.type = type;

      // 清空選項（僅適用於需要選項的題型）
      if (type !== 'single' && type !== 'multiple' && type !== 'dropdown') {
        question.options = [];
      }

      // 重置驗證設置，但保留圖片
      question.validation = {
        minValue: '',
        maxValue: '',
        minLength: '',
        maxLength: '',
        pattern: ''
      };
      question.image = oldImage; // 恢復圖片

      renderQuestions();
    }

    // 切換必填
    function toggleRequired(questionId, required) {
      const question = questions.find(q => q.id === questionId);
      question.required = required;
    }

    // 新增選項
    function addOption(questionId) {
      const question = questions.find(q => q.id === questionId);
      question.options.push('');
      renderQuestions();
    }

    // 更新選項
    function updateOption(questionId, index, value) {
      const question = questions.find(q => q.id === questionId);
      question.options[index] = value;
    }

    // 刪除選項
    function removeOption(questionId, index) {
      const question = questions.find(q => q.id === questionId);
      question.options.splice(index, 1);
      renderQuestions();
    }

    // 刪除題目
    function removeQuestion(questionId) {
      questions = questions.filter(q => q.id !== questionId);
      renderQuestions();
    }

    // 儲存問卷
    async function saveSurvey() {
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const token = localStorage.getItem('token');
      const userId = localStorage.getItem('userId');

      try {
        let res = await fetch('http://localhost:5000/api/surveys', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json',
          },
          body: JSON.stringify({        
            title,
            description,
            questions,
            userId
          }),
        });

        // 處理 token 失效的情況
        res = handleApiResponse(res);
        if (!res) return; // 如果 token 失效，handleApiResponse 會返回 null

        if (res.ok) {
          const survey = await res.json();
          alert('問卷儲存成功！');
          window.location.href = 'dashboard.html'; 
        } else {
          const error = await res.json();
          alert(`儲存問卷失敗！原因：${error.error || '未知錯誤'}`);
        }
      } catch (err) {
        console.error('儲存問卷時發生錯誤:', err);
        alert('伺服器錯誤，請稍後再試');
      }
    }

    // 匯出問卷
    function exportSurvey() {
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      // 假設 questions 是全域變數
      const data = { title, description, questions };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = (title || 'survey') + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 匯入問卷
    function importSurvey(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          document.getElementById('title').value = data.title || '';
          document.getElementById('description').value = data.description || '';
          questions = Array.isArray(data.questions) ? data.questions : [];
          // 若有即時顯示功能，需同步更新
          if (typeof updateLiveTitle === 'function') updateLiveTitle(data.title || '');
          if (typeof updateLiveDescription === 'function') updateLiveDescription(data.description || '');
          renderQuestions();
        } catch (err) {
          alert('匯入失敗，檔案格式錯誤');
        }
      };
      reader.readAsText(file);
      // 清空 input 以便下次可重新選同一檔案
      event.target.value = '';
    }
  
    // 加載問卷
    function loadSurvey() {
      const preview = localStorage.getItem('previewSurvey');
      if (preview) {
        try {
          const data = JSON.parse(preview);
          document.getElementById('title').value = data.title || '';
          document.getElementById('description').value = data.description || '';
          questions = Array.isArray(data.questions) ? data.questions : [];
          if (typeof updateLiveTitle === 'function') updateLiveTitle(data.title || '');
          if (typeof updateLiveDescription === 'function') updateLiveDescription(data.description || '');
          renderQuestions();
          // 清除暫存，避免下次誤載
          localStorage.removeItem('previewSurvey');
        } catch (e) {
          // 若解析失敗則忽略
        }
      }
    }

    // 檢查是否是編輯模式
    async function checkEditMode() {
      const isEdit = new URLSearchParams(window.location.search).get('edit') === 'true';
      if (isEdit) {
        isEditMode = true;
        editingSurveyId = localStorage.getItem('editingSurveyId');
        console.log('編輯模式，問卷ID:', editingSurveyId);
        
        if (editingSurveyId) {
          await loadSurveyForEditing(editingSurveyId);
        }
      }
    }
  
    // 加載問卷數據用於編輯
    async function loadSurveyForEditing(surveyId) {
      const token = localStorage.getItem('token');
      if (!token) {
        alert('請先登入');
        window.location.href = 'index.html';
        return;
      }
      
      try {
        console.log('正在載入問卷:', surveyId);
        let res = await fetch(`${API_URL}/${surveyId}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });
      
        // 處理 token 失效的情況
        res = handleApiResponse(res);
        if (!res) return; // 如果 token 失效，handleApiResponse 會返回 null
      
        if (res.ok) {
          const survey = await res.json();
          console.log('載入的問卷數據:', survey);
          
          // 填充表單
          document.getElementById('title').value = survey.title || '';
          document.getElementById('description').value = survey.description || '';
        
          // 更新即時顯示
          updateLiveTitle(survey.title || '');
          updateLiveDescription(survey.description || '');
        
          // 載入問題
          if (Array.isArray(survey.questions)) {
            questions = survey.questions;

            // 確保每個問題都有 id、page 和 validation 屬性
            questions = questions.map((q, index) => {
              if (!q.id) {
                q.id = `q${index}`;
              }
              // 確保每個問題都有 page 屬性
              if (!q.page) {
                q.page = 1;
              }
              // 確保每個問題都有 validation 屬性
              if (!q.validation) {
                q.validation = {
                  minValue: '',
                  maxValue: '',
                  minLength: '',
                  maxLength: '',
                  pattern: '',
                  maxChoices: ''
                };
              }
              // 確保每個問題都有 options 屬性
              if (!q.options) {
                q.options = [];
              }
              return q;
            });
            
            // 確定總頁數
            const maxPage = Math.max(...questions.map(q => q.page || 1), 1);
            totalPages = maxPage;
            currentPage = 1;
          
            renderPaginationControls();
            renderQuestions();
            
            console.log('問卷題目已載入:', questions);
          } else {
            console.log('問卷沒有題目或題目格式不正確');
            questions = [];
          }
        
          // 修改儲存按鈕行為
          document.getElementById('saveButton').onclick = function() {
            updateSurvey(surveyId);
          };
        } else {
          console.error('載入問卷失敗:', await res.text());
          alert('無法載入問卷數據');
        }
      } catch (err) {
        console.error('載入問卷失敗:', err);
        alert('載入問卷失敗');
      }
    }

    // 更新問卷
    async function updateSurvey(surveyId) {
      const title = document.getElementById('title').value;
      const description = document.getElementById('description').value;
      const token = localStorage.getItem('token');

      try {
        console.log('正在更新問卷:', surveyId);
        let res = await fetch(`${API_URL}/${surveyId}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            title,
            description,
            questions
          })
        });
        
        // 處理 token 失效的情況
        res = handleApiResponse(res);
        if (!res) return; // 如果 token 失效，handleApiResponse 會返回 null
      
        if (res.ok) {
          alert('問卷更新成功！');
          window.location.href = 'dashboard.html';
        } else {
          const error = await res.json();
          alert(`更新問卷失敗：${error.error || '未知錯誤'}`);
        }
      } catch (err) {
        console.error('更新問卷時發生錯誤:', err);
        alert('伺服器錯誤，請稍後再試');
      }
    }
  </script>
</body>
